  <style>
    :root {
      color-scheme: dark;
      --ink: #100c20;
      --cyan: #43e9ff;
      --pink: #ff4eb5;
      --violet: #9c6dff;
      --paper: #f8f4ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-content: center; gap: 13px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); overflow: auto; isolation: isolate; text-align: center; background: radial-gradient(ellipse at 18% 14%, #37205dcc 0%, transparent 42%), radial-gradient(ellipse at 83% 86%, #52164ccc 0%, transparent 42%), var(--ink); }
    #loading[hidden], [hidden] { display: none; }
    .loader-mark { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .loader-mark img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 0 15px #8339ff88); }
    .eyebrow { color: #b7adcb; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { max-width: 680px; margin: 0; font-size: clamp(25px, 6vw, 52px); line-height: 1.02; letter-spacing: -.045em; font-weight: 1000; }
    h1 .cyan { color: var(--cyan); text-shadow: 0 0 26px #43e9ff66; }
    h1 .pink { color: var(--pink); text-shadow: 0 0 26px #ff4eb566; }
    #loading-status { margin: 3px 0 0; color: #d4cadf; font-weight: 650; }
    #loading-progress { display: block; width: min(380px, 78vw); height: 8px; justify-self: center; border: 0; border-radius: 99px; overflow: hidden; accent-color: var(--cyan); background: #ffffff20; }
    #loading-progress::-webkit-progress-bar { border-radius: 99px; background: #ffffff20; }
    #loading-progress::-webkit-progress-value { border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink)); box-shadow: 0 0 18px #43e9ff80; }
    #loading-progress::-moz-progress-bar { border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink)); }
    #loading-notice { max-width: min(400px, 84vw); margin: 0 auto; color: #d4cadf; line-height: 1.5; }
    #loading-retry { min-height: 46px; justify-self: center; padding: 0 24px; border: 1px solid #43e9ff88; border-radius: 13px; background: #43e9ff14; color: var(--paper); font: inherit; font-weight: 800; cursor: pointer; }
    #loading-retry:hover { background: #43e9ff27; }
    #loading-retry:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
    .loader-foot { color: #948aa8; font-size: 12px; }
    @media (max-height: 460px) and (min-aspect-ratio: 1/1) { #loading { grid-auto-flow: column; grid-template-columns: auto auto; gap: 8px 24px; text-align: left; } .loader-mark { grid-row: span 3; } #loading-progress, #loading-retry { justify-self: start; } .loader-mark img { width: 44px; height: 44px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
